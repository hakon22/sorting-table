services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3019:3019"
    volumes:
      - ./logs:/srv/logs
    command: start:server:docker:dev

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./logs:/srv/logs
    command: start:worker:docker:dev

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "4001:80"
    volumes:
      - ./web/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

