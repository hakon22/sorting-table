name: Deploy to VPS [sorting-table]

on:
  push:
    branches:
      - production
  workflow_dispatch:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.set.outputs.api }}
      worker: ${{ steps.set.outputs.worker }}
      frontend: ${{ steps.set.outputs.frontend }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed paths
        uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'push'
        with:
          filters: |
            api:
              - 'api/**'
              - 'shared/**'
              - 'Dockerfile'
              - 'package.json'
              - 'package-lock.json'
              - 'docker-compose.prod.yml'
              - '.github/workflows/deploy.yml'
            worker:
              - 'worker/**'
              - 'shared/**'
              - 'Dockerfile.worker'
              - 'package.json'
              - 'package-lock.json'
              - 'docker-compose.prod.yml'
              - '.github/workflows/deploy.yml'
            frontend:
              - 'web/**'
              - 'shared/**'
              - 'Dockerfile.web'
              - 'package.json'
              - 'package-lock.json'
              - 'docker-compose.prod.yml'
              - '.github/workflows/deploy.yml'

      - name: Set pipeline flags
        id: set
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "api=true" >> "$GITHUB_OUTPUT"
            echo "worker=true" >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "api=${{ steps.filter.outputs.api }}" >> "$GITHUB_OUTPUT"
            echo "worker=${{ steps.filter.outputs.worker }}" >> "$GITHUB_OUTPUT"
            echo "frontend=${{ steps.filter.outputs.frontend }}" >> "$GITHUB_OUTPUT"
          fi

  api_test:
    needs: [changes]
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx eslint "api/src" "shared"

  worker_test:
    needs: [changes]
    if: needs.changes.outputs.worker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx eslint "worker/src" "shared"

  frontend_test:
    needs: [changes]
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx eslint "web/src"
      - run: npm run build -w web
        env:
          VITE_API_BASE_URL: /sorting-table/api/v1
          VITE_BASE_PATH: /sorting-table/

  api_build:
    needs: [changes, api_test]
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: ${{ github.workflow }}-api-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/sorting-table-api:latest

  worker_build:
    needs: [changes, worker_test]
    if: needs.changes.outputs.worker == 'true'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: ${{ github.workflow }}-worker-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.worker
          platforms: linux/amd64
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/sorting-table-worker:latest

  frontend_build:
    needs: [changes, frontend_test]
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: ${{ github.workflow }}-frontend-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.web
          platforms: linux/amd64
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/sorting-table-web:latest
          build-args: |
            VITE_API_BASE_URL=/sorting-table/api/v1
            VITE_BASE_PATH=/sorting-table/

  api_deploy:
    needs: [changes, api_build]
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: appleboy/scp-action@v0.1.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SORTING_TABLE_SSH_PRIVATE_KEY }}
          source: "docker-compose.prod.yml"
          target: "/var/www/portfolio.am-projects.ru/sorting-table/"
      - uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SORTING_TABLE_SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /var/www/portfolio.am-projects.ru/sorting-table/
            echo "${{ secrets.DOCKER_TOKEN }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
            docker pull ${{ secrets.DOCKER_USERNAME }}/sorting-table-api:latest
            export DOCKER_USERNAME='${{ secrets.DOCKER_USERNAME }}'
            docker compose -f docker-compose.prod.yml up -d api
            docker image prune -f

  worker_deploy:
    needs: [changes, worker_build]
    if: needs.changes.outputs.worker == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: appleboy/scp-action@v0.1.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SORTING_TABLE_SSH_PRIVATE_KEY }}
          source: "docker-compose.prod.yml"
          target: "/var/www/portfolio.am-projects.ru/sorting-table/"
      - uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SORTING_TABLE_SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /var/www/portfolio.am-projects.ru/sorting-table/
            echo "${{ secrets.DOCKER_TOKEN }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
            docker pull ${{ secrets.DOCKER_USERNAME }}/sorting-table-worker:latest
            export DOCKER_USERNAME='${{ secrets.DOCKER_USERNAME }}'
            docker compose -f docker-compose.prod.yml up -d worker
            docker image prune -f

  frontend_deploy:
    needs: [changes, frontend_build]
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: appleboy/scp-action@v0.1.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SORTING_TABLE_SSH_PRIVATE_KEY }}
          source: "docker-compose.prod.yml"
          target: "/var/www/portfolio.am-projects.ru/sorting-table/"
      - uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SORTING_TABLE_SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /var/www/portfolio.am-projects.ru/sorting-table/
            echo "${{ secrets.DOCKER_TOKEN }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
            docker pull ${{ secrets.DOCKER_USERNAME }}/sorting-table-web:latest
            export DOCKER_USERNAME='${{ secrets.DOCKER_USERNAME }}'
            docker compose -f docker-compose.prod.yml up -d web
            docker image prune -f
